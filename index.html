<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/style.css">
    <script src="./script.js" defer type="module"></script>
    <title>WhatsApp Web</title>
</head>
<body class="grid-container">
    <header>
        <div class="foto-header-container">
            <div class="perfil-header">
            <img class="foto-contato-header" src="" alt="foto do perfil ativo">
            <span class="nome-header">Você</span>
        </div>

            <div class="icon-header">
            <img class="camera-header" src="./assets/icons/video-cam.svg" alt="">
            <img class="menu-header" src="./assets/icons/down-menu.svg" alt="">
            <img class="config-header" src="./assets/icons/more-settings.svg" alt="">
        </div>
        </div>
    </header>
    <nav>
        <div class="container-nav">
            <img class="icone-conversas" src="./assets/icons/messages.svg" alt="">
            <img src="./assets/icons/status.svg" alt="">
            <img src="./assets/icons/newsletter.svg" alt="">
            <img src="./assets/icons/community.svg" alt="">

        </div>
        <div class="container-nav">
            <img src="./assets/icons/settings.svg" alt="">
            <img class="icone-perfil-nav" src="" alt="foto do perfil ativo">
        </div>
    </nav>
    <section class="secao-lateral">
        <div class="conversas-container">
            <div class="container-titulo">
                <h1>WhatsApp</h1>
                <div class="btn-newchat">
                <img src="./assets/icons/new-chat.svg" alt="">
                <img src="./assets/icons/more-settings.svg" alt="">
                </div>
            </div>
    <form class="form-pesquisa" action="">
        <input type="text" placeholder="🔍    Pesquisar ou começar uma nova conversa">
    </form>

    <div class="botoes">
        <button>Tudo</button>
        <button>Não lidas</button>
        <button>Favoritos</button>
        <button>Grupos</button>
    </div>
    <div class="lista-contatos">
        <!-- Preenchido dinamicamente pelo script.js a partir de contatos.js -->
    </div>

    </div>

    <div class="perfil-container">
        <div class="perfil-titulo">
            <h1>Perfil</h1>
        </div>

        <div class="perfil-foto-container">
            <img src="" alt="foto de perfil" class="perfil-foto">
        </div>

        <div class="perfil-campo perfil-nome">
            <span class="perfil-label">Nome</span>
            <span class="perfil-valor perfil-valor-nome"></span>
        </div>

        <div class="perfil-campo perfil-recado">
            <span class="perfil-label">Recado</span>
            <div class="perfil-linha">
                <span class="perfil-valor">Disponível</span>
                <img src="./assets/icons/cursor-pointer.svg" alt="editar recado" class="icone-editar">
            </div>
        </div>

        <div class="perfil-campo perfil-telefone">
            <span class="perfil-label">Telefone</span>
            <div class="perfil-linha">
                <div class="perfil-telefone-info">
                    <img src="./assets/icons/phone.svg" alt="telefone" class="icone-telefone">
                    <span class="perfil-valor perfil-valor-telefone"></span>
                </div>
            </div>
        </div>

        <div class="perfil-trocar">
            <h2>Trocar de Perfil</h2>
            <div class="lista-perfis">
                <!-- Preenchido dinamicamente pelo script.js com os perfis disponíveis para troca -->
            </div>
        </div>

    </div>

    </section>
    <main>
        <div class="chat-header oculto">
            <img class="chat-header-foto" src="" alt="">
            <div class="chat-header-info">
                <span class="chat-header-nome"></span>
                <span class="chat-header-status"></span>
            </div>
        </div>

        <div class="chat-vazio">
            <p>Selecione uma conversa para começar a enviar mensagens</p>
        </div>

        <div class="chat-mensagens oculto">
            <!-- Preenchido dinamicamente pelo script.js quando uma conversa é aberta -->
        </div>

        <form class="chat-input" action="">
            <button type="button" class="icone-rodape"><img src="./assets/icons/plus.svg" alt="">
            </button>

            <button type="button" class="icone-rodape">
                <img src="./assets/icons/expressions.svg" alt="">
            </button>

            <div class="campo-texto">
                <input type="text" placeholder="Digite uma mensagem">
            </div>

            <button type="button" class="icone-rodape icone-enviar">
                <img src="./assets/icons/send-message.png" alt="">
            </button>
        </form>
    </main>
</body>
</html>
